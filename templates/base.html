<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f6f2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <title>{% block title %}{% endblock %} · GoodHood</title>
</head>
<body>
    <a class="skip-link" href="#main-content">Перейти к содержимому</a>
    <header class="site-header page-width">
        <a href="{{ url_for('index') }}" class="brand" aria-label="GoodHood — главная"><span class="brand-mark" aria-hidden="true">g.</span>goodhood<span class="brand-dot">✳</span></a>
        <nav class="site-nav" aria-label="Основная навигация">
            <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Главная</a>
            <a href="{{ url_for('posts') }}" {% if request.endpoint == 'posts' %}aria-current="page"{% endif %}>Статьи</a>
            <a href="{{ url_for('about') }}" {% if request.endpoint == 'about' %}aria-current="page"{% endif %}>О проекте</a>
        </nav>
        <a class="button button-dark header-action" href="{{ url_for('create_article') }}"><span aria-hidden="true">＋</span> Написать статью</a>
    </header>
    <main id="main-content">{% block body %}{% endblock %}</main>
    <footer class="site-footer page-width">
        <div><a class="footer-brand" href="{{ url_for('index') }}">goodhood ✳</a><p>Место для мыслей, которыми хочется поделиться.</p></div>
        <span class="footer-note">Сделано с любопытством <span aria-hidden="true">↗</span></span>
    </footer>
</body>
</html>
